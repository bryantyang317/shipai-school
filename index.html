show('<div class="c"><div style="text-align:right;margin-bottom:-6px"><button class="chip" onclick="qx()">✖ 退出</button></div><small>'+(z.m=='test'?'模擬考':z.m=='weak'?'弱點加強':'互動練習')+'　第 '+(z.i+1)+' / '+z.qs.length+' 題</small><progress value="'+z.i+'" max="'+z.qs.length+'"></progress><div class="big'+(q.q.replace(/\[\[[^\]]*\]\]/g,'').length>16?' long':'')+'">'+fmt(q.q)+'</div>'+z.o.map(function(o,k){var c='';if(done&&z.m!='test'){if(o[1])c='ok';else if(k==z.k)c='bad'}return '<button class="b opt'+(o[0].length>14?' sm':'')+' '+c+'" '+(done?'disabled':'')+' onclick="ans('+k+')">'+esc(o[0])+'</button>'}).join('')+(done&&z.m!='test'?'<div style="text-align:center">'+(z.o[z.k][1]?'🎉 答對了！+10 分':'💡 再記一次，答案是「'+esc(q.c[q.a])+'」')+'</div>'+(q.h?'<div class="hint">📝 '+esc(q.h)+'</div>':'')+'<button class="b pri opt" onclick="nx()">下一題 ➜</button>':'')+'</div>')}
function ans(k){var z=quiz,q=z.qs[z.i],p=P(),r=z.o[k][1],s=p.st[q.q]||(p.st[q.q]={r:0,w:0,s:0});if(z.k>-1)return;z.k=k;if(r){z.ok++;s.r++;s.s++;if(z.m!='test'){p.pts+=10;p.tot+=10}}else{s.w++;s.s=0;z.wr.push(q)}sv(1);if(z.m=='test')nx();else qv()}
function nx(){var z=quiz;z.i++;z.k=-1;z.o=null;if(z.i<z.qs.length)return qv();fin()}
function fin(){var z=quiz,p=P(),n=z.qs.length,sc=Math.round(z.ok/n*100),b=0,h='';if(z.m=='test'){b=z.ok*5+(sc>=90?30:0);p.pts+=b;p.tot+=b;var d=new Date();p.hist.push({d:(d.getMonth()+1)+'/'+d.getDate(),s:sc,t:Date.now()});h='<div class="big">'+sc+' 分</div><p style="text-align:center">答對 '+z.ok+' / '+n+' 題，獲得 '+b+' 分'+(sc>=90?'（滿分獎勵 +30）':'')+'</p>'}else{h='<div class="big">'+z.ok+' / '+n+'</div><p style="text-align:center">本次練習獲得 '+z.ok*10+' 分</p>'}
sv(1);show('<h1>'+(sc>=90?'🌟 太棒了！':'💪 繼續加油！')+'</h1><div class="c">'+h+(z.wr.length?'<b>要再複習：</b><br>'+z.wr.map(function(q){return '・'+plain(q.q)+' → <b>'+esc(q.c[q.a])+'</b>'+(q.h?'<br><small>📝 '+esc(q.h)+'</small>':'')}).join('<br>'):'<p style="text-align:center">全部答對！</p>')+'</div><button class="b pri" onclick="room()">回'+SUBS[sub].n+'</button>'+nav())}
function shop(){var p=P();show(nav()+'<h1>🎁 獎勵商店</h1><div class="c">⭐ 目前 '+p.pts+' 分<br><small>兌換後會產生獎勵券，請家長確認後再領取文具。</small>'+(SH().length?SH().map(function(s,i){return '<button class="b" '+(p.pts<s[1]?'disabled':'')+' onclick="buy('+i+')">'+esc(s[0])+'　⭐'+s[1]+'</button>'}).join(''):'<br><small>目前沒有商品，請家長到「家長」頁新增。</small>')+'</div>')}
function buy(i){var p=P(),s=SH()[i];if(!s||p.pts<s[1])return;p.pts-=s[1];p.tix.push({n:s[0],d:new Date().toLocaleDateString('zh-TW'),done:0,t:Date.now()});sv(1);shop()}
/* ===== 家長密碼（4 位數字；只存雜湊，兩台裝置同步） ===== */
function hp(s){var h1=0xdeadbeef,h2=0x41c6ce57,i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function parent(){if(!S.pin)return pinPage('set');if(Date.now()-unl>300000)return pinPage('ask');unl=Date.now();parentBody()}
function pinPage(mode,msg){var h='<h1>👪 家長確認</h1><div class="c">',inp=function(id,ph){return '<input id="'+id+'" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="'+ph+'" style="font-size:24px;text-align:center;letter-spacing:8px;margin:6px 0">'};
if(mode=='set')h+='<b>設定家長密碼</b><br><small>請設定 4 位數字。之後要確認獎勵券、修改商店品項，都需要輸入。</small>'+inp('pin1','輸入 4 位數字')+inp('pin2','再輸入一次')+'<button class="b pri" onclick="pinSet()">設定密碼</button>';
else if(mode=='ask')h+='<b>請輸入家長密碼</b>'+inp('pin','4 位數字')+'<button class="b pri" onclick="pinCheck()">確認</button><button class="chip" onclick="pinPage(\'forgot\')">忘記密碼？</button>';
else{PA=30+Math.floor(Math.random()*40);PB=4+Math.floor(Math.random()*6);h+='<b>忘記密碼</b><br><small>請回答下面的算術題，答對就可以重設密碼。</small><div class="big">'+PA+' × '+PB+' ＝ ？</div><input id="pans" type="number" inputmode="numeric" style="font-size:24px;text-align:center"><button class="b pri" onclick="pinForgot()">確認</button>'}
if(msg)h+='<p style="text-align:center;color:#c0392b">'+esc(msg)+'</p>';show(nav()+h+'</div>')}
var unl=0,pinFail=0,lockUntil=0,PA=0,PB=0;
function pinSet(){var a=$('#pin1').value.trim(),b=$('#pin2').value.trim();if(!/^\d{4}$/.test(a))return pinPage('set','請輸入 4 位數字');if(a!==b)return pinPage('set','兩次輸入不一樣');S.pin=hp('shipai:'+a);S.pinTs=Date.now();pinDirty=1;persist();kick();unl=Date.now();parent()}
function pinCheck(){var v=($('#pin').value||'').trim();if(Date.now()<lockUntil)return pinPage('ask','輸入錯太多次，請稍等 30 秒');if(hp('shipai:'+v)===S.pin){pinFail=0;unl=Date.now();return parent()}if(++pinFail>=3){lockUntil=Date.now()+30000;pinFail=0}pinPage('ask','密碼不對')}
function pinForgot(){if(parseInt($('#pans').value,10)===PA*PB){S.pin='';S.pinTs=Date.now();pinDirty=1;persist();kick();return pinPage('set','請設定新的密碼')}pinPage('forgot','答案不對，再試一次')}
function parentBody(){var p=P();show(nav()+'<h1>👪 家長確認</h1><div class="c"><b>獎勵券</b>'+(p.tix.length?p.tix.map(function(t,i){return '<div style="margin:8px 0">'+t.d+'　'+t.n+'　'+(t.done?'✅ 已兌換':'<button class="chip" onclick="dn('+i+')">確認已給</button>')+'</div>'}).join(''):'<br><small>目前沒有獎勵券</small>')+'</div>'+famInfo()+shopEd())}
function shopEd(){return '<div class="c"><b>🛍 商店品項設定</b><br><small>可新增、刪除，也能修改名稱和所需積分。改完按「儲存」，兩台裝置會一起更新。</small>'+SH().map(function(s,i){return '<div class="row" style="align-items:center;margin:6px 0"><input id="sn'+i+'" value="'+escA(s[0])+'" style="flex:3" aria-label="商品名稱"><input id="sp'+i+'" type="number" min="1" value="'+(+s[1]||1)+'" style="flex:1.3" aria-label="所需積分"><button class="chip" style="flex:0 0 auto" onclick="shopDel('+i+')">刪除</button></div>'}).join('')+'<button class="b" onclick="shopAdd()">＋ 新增商品</button><button class="b pri" onclick="shopSave()">儲存商店設定</button><button class="b" onclick="shopReset()">還原預設商品</button><button class="b" onclick="pinPage(\'set\')">🔑 修改家長密碼</button></div>'}
function shopRead(keep){var a=[];SH().forEach(function(s,i){var n=$('#sn'+i),p=$('#sp'+i);if(!n||!p)return;var nm=n.value.trim(),pt=Math.max(1,parseInt(p.value,10)||0);if(nm||keep)a.push([nm,pt])});return a}
function setShop(a){S.shop=a;S.shopTs=Date.now();shopDirty=1;persist();kick();parent()}
function shopAdd(){var a=shopRead();a.push(['新商品',100]);setShop(a)}
function shopDel(i){var a=shopRead(true);a.splice(i,1);setShop(a.filter(function(s){return s[0]}))}
function shopSave(){setShop(shopRead());alert('商店設定已儲存')}
function shopReset(){if(confirm('要還原成預設的商品和積分嗎？'))setShop(DEF.map(function(s){return[s[0],s[1]]}))}
function dn(i){if(confirm('確認已經給孩子這項獎勵了嗎？')){P().tix[i].done=1;sv(1);parent()}}
function setg(){show(nav()+'<h1>⚙ 設定</h1>'+cloudCard()+'<div class="c"><b>匯入新題目</b><br><small>每行一題：課別|題型|題目（空格用＿）|選項用/分隔|答案編號從0開始|重點字。數學題請在最後加上 |math，後面還可以再加 |提示說明。可把新卷子傳給 Claude 整理成這個格式。</small><textarea id="ex" rows="5">'+(S.ex||'')+'</textarea><button class="b" onclick="exSave()">儲存題目</button></div><div class="c"><b>備份／搬移進度</b><br><small>複製這段文字，到另一台裝置貼上就能搬移進度。</small><textarea id="bk" rows="4">'+JSON.stringify(S).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea><button class="b" onclick="try{S=JSON.parse($(\'#bk\').value);S.u=S.u||{};Q=build();allDirty();login()}catch(e){alert(\'格式不正確\')}">匯入進度</button></div><button class="b" onclick="S.cur=null;sv();login()">切換使用者</button>')}
S.cur&&S.u[S.cur]?home():login();
startSync();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
